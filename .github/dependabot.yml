version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The published package has zero runtime dependencies; these are dev tools.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TS 7 ships no compiler API; tsup's dts build needs it (revisit when tsup supports TS 7).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types track the oldest supported runtime (engines: node >=22).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
